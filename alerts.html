<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts — CORTEX OS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
}

.page-head { background:#fff; border-bottom:1px solid #e8eaed; padding: 22px 32px 18px; }
.page-head h1 { font-size: 22px; font-weight: 800; letter-spacing:-.5px; color:#0d1b2a; }
.page-head p { font-size: 13px; color:#757575; margin-top: 3px; }

.wrap { max-width: 1600px; margin: 0 auto; padding: 20px 32px 60px; }

select, input {
  font: inherit; font-size:13px; padding: 6px 10px; border: 1px solid #d4d7dc;
  border-radius: 6px; background: #fff; color:#1a1a2e; cursor:pointer;
}
select:focus, input:focus { outline:none; border-color:#4285F4; }

/* ===== TOP BAR: METRICS + FILTERS ===== */
.top-bar {
  display: flex; gap: 16px; align-items: flex-start; margin-bottom: 20px;
}
@media(max-width:1100px){ .top-bar { flex-direction: column; } }

/* Metrics strip */
.metrics-strip {
  display: flex; gap: 8px; flex-shrink: 0;
}
.m-chip {
  background: #fff; border: 1px solid #e8eaed; border-radius: 8px;
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.m-chip .m-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.m-chip .m-dot.p0 { background: #c5221f; }
.m-chip .m-dot.p1 { background: #f6b26b; }
.m-chip .m-dot.ok { background: #137333; }
.m-chip .m-dot.gray { background: #9e9e9e; }
.m-chip .m-body { line-height: 1.2; }
.m-chip .m-val { font-size: 20px; font-weight: 800; color: #0d1b2a; letter-spacing: -0.5px; }
.m-chip .m-lbl { font-size: 11px; color: #9e9e9e; font-weight: 600; }
.m-chip.p0 .m-val { color: #c5221f; }
.m-chip.p1 .m-val { color: #b06000; }
.m-chip.ok .m-val { color: #137333; }

/* Filters strip */
.filters-strip {
  flex: 1; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;
  background: #fff; border: 1px solid #e8eaed; border-radius: 8px;
  padding: 10px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.filters-strip .fg { display: flex; flex-direction: column; gap: 3px; }
.filters-strip .fg label { font-size: 10px; font-weight: 700; color: #9e9e9e; text-transform: uppercase; letter-spacing: .5px; }
.filters-strip .fg select, .filters-strip .fg input {
  height: 32px; padding: 0 8px; font-size: 13px; color: #0d1b2a;
  background: #fff; border: 1px solid #d4d7dc; border-radius: 6px;
  min-width: 130px; outline: none;
}
.filters-strip .fg input { min-width: 180px; }
.fbtn {
  font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px;
  cursor: pointer; border: 1px solid #d4d7dc; background: #fff; color: #5f6368;
  transition: all .12s ease; height: 32px;
}
.fbtn:hover { color: #0d1b2a; border-color: #0d1b2a; }
.fbtn.active { background: #0d1b2a; color: #fff; border-color: #0d1b2a; }
.fbtn.clear { display: none; }
.fbtn.clear.show { display: inline-block; }

/* ===== DASHBOARD LAYOUT ===== */
.dash {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
}
@media(max-width:1000px){ .dash { grid-template-columns: 1fr; } }

/* Sidebar: breakdown by type */
.side-panel {
  background: #fff; border: 1px solid #e8eaed; border-radius: 10px;
  padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.side-panel h3 {
  font-size: 12px; font-weight: 700; color: #9e9e9e;
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px;
}
.type-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid #f1f3f4;
  cursor: pointer; transition: background .12s ease;
  border-radius: 6px; padding-left: 8px; padding-right: 8px;
}
.type-row:hover { background: #f7f9fc; }
.type-row:last-child { border-bottom: none; }
.type-row .t-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.type-row .t-icon.red { background: #fce8e6; }
.type-row .t-icon.orange { background: #fef3e8; }
.type-row .t-icon.blue { background: #e8f0fe; }
.type-row .t-icon.purple { background: #f3e8fd; }
.type-row .t-body { flex: 1; }
.type-row .t-name { font-size: 13px; font-weight: 600; color: #0d1b2a; }
.type-row .t-count { font-size: 12px; color: #9e9e9e; }
.type-row .t-bar {
  width: 100%; height: 4px; background: #f1f3f4; border-radius: 2px; margin-top: 4px; overflow: hidden;
}
.type-row .t-bar-fill { height: 100%; border-radius: 2px; }
.type-row .t-bar-fill.red { background: #c5221f; }
.type-row .t-bar-fill.orange { background: #f6b26b; }
.type-row .t-bar-fill.blue { background: #4285F4; }
.type-row .t-bar-fill.purple { background: #a142f4; }

/* AM list sidebar */
.am-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px; border-radius: 6px; cursor: pointer;
  font-size: 13px; transition: background .12s ease;
}
.am-row:hover { background: #f7f9fc; }
.am-row .am-name { color: #0d1b2a; font-weight: 500; }
.am-row .am-count {
  font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
  background: #f1f3f4; color: #5f6368;
}
.am-row .am-count.p0 { background: #fce8e6; color: #c5221f; }
.am-row .am-count.p1 { background: #fef3e8; color: #b06000; }

/* ===== MAIN TABLE ===== */
.main-panel {
  background: #fff; border: 1px solid #e8eaed; border-radius: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.03); overflow: hidden;
}

.table-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; border-bottom: 1px solid #eef0f2;
}
.table-header h3 {
  font-size: 13px; font-weight: 700; color: #0d1b2a;
  text-transform: uppercase; letter-spacing: .5px;
}
.table-header .table-meta { font-size: 12px; color: #9e9e9e; }

/* The table */
.alert-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.alert-table th {
  text-align: left; padding: 10px 14px;
  color: #9e9e9e; font-weight: 700; font-size: 11px;
  text-transform: uppercase; letter-spacing: .4px;
  background: #fafbfc; border-bottom: 1px solid #eef0f2;
  white-space: nowrap;
}
.alert-table td {
  padding: 12px 14px; border-bottom: 1px solid #f1f3f4;
  vertical-align: top;
}
.alert-table tbody tr:last-child td { border-bottom: none; }
.alert-table tbody tr:hover { background: #f7f9fc; }

/* Severity indicator in table row */
.alert-table tbody tr { position: relative; }
.alert-table tbody tr::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.alert-table tbody tr.p0::before { background: #c5221f; }
.alert-table tbody tr.p1::before { background: #f6b26b; }
.alert-table tbody tr.p0 td:first-child { padding-left: 18px; }
.alert-table tbody tr.p1 td:first-child { padding-left: 18px; }

/* Cell styles */
.cell-client { min-width: 220px; }
.cell-client .c-name {
  font-size: 14px; font-weight: 700; color: #0d1b2a; line-height: 1.3;
}
.cell-client .c-name .new-tag {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  font-weight: 700; background: #fce8e6; color: #c5221f;
  margin-left: 6px; vertical-align: middle;
}
.cell-client .c-meta {
  font-size: 11px; color: #9e9e9e; margin-top: 3px;
}
.cell-client .c-entity {
  font-size: 11px; color: #5f6368; margin-top: 2px;
}

.cell-sev { white-space: nowrap; width: 1px; }
.sev-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  font-weight: 700; display: inline-block;
}
.sev-tag.p0 { background: #fce8e6; color: #c5221f; }
.sev-tag.p1 { background: #fef3e8; color: #b06000; }

.cell-type { white-space: nowrap; width: 1px; }
.type-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 6px;
  font-weight: 700; display: inline-block; background: #e8eaed; color: #5f6368;
}

.cell-av { white-space: nowrap; width: 1px; }
.av-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  font-weight: 700; display: inline-block;
}
.av-tag.ok { background: #e6f4ea; color: #137333; }
.av-tag.no { background: #fce8e6; color: #c5221f; }
.av-tag.prog { background: #fef3e8; color: #b06000; }
.av-tag.stuck { background: #fce5cd; color: #b45309; }
.av-tag.na { background: #f1f3f4; color: #9e9e9e; }

.cell-detail { max-width: 400px; }
.cell-detail .d-text { color: #3c4043; line-height: 1.45; }
.cell-detail .d-time { font-size: 11px; color: #b0b3b8; margin-top: 4px; }

.cell-actions { white-space: nowrap; width: 1px; }
.cell-actions a {
  font-size: 12px; padding: 5px 10px; border-radius: 6px;
  border: 1px solid #d4d7dc; background: #fff; color: #5f6368;
  cursor: pointer; text-decoration: none; display: inline-block;
  transition: all .12s ease; white-space: nowrap;
}
.cell-actions a:hover { color: #0d1b2a; border-color: #0d1b2a; }

/* Pagination */
.pager {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; border-top: 1px solid #eef0f2;
}
.pager .pg-info { font-size: 12px; color: #9e9e9e; }
.pager .pg-btns { display: flex; gap: 6px; }
.pager .pg-btns button {
  font: inherit; font-size: 12px; padding: 6px 14px;
  border: 1px solid #d4d7dc; border-radius: 6px;
  background: #fff; color: #5f6368; cursor: pointer;
}
.pager .pg-btns button:hover { border-color: #0d1b2a; color: #0d1b2a; }
.pager .pg-btns button:disabled { opacity: .4; cursor: not-allowed; }

/* States */
.state { text-align:center; padding:60px 20px; color:#9e9e9e; }
.state .big { font-size:16px; font-weight:700; color:#5f6368; margin-bottom:8px; }
.spinner { width:24px; height:24px; border:3px solid #e0e0e0; border-top-color:#00D4AA; border-radius:50%; margin:0 auto 12px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.retry { margin-top:12px; padding:8px 16px; border:1px solid #d4d7dc; border-radius:8px; background:#fff; cursor:pointer; font:inherit; font-size:13px; }
.empty { text-align:center; padding:40px 20px; color:#9e9e9e; font-size:13px; }
.refreshed { font-size:11px; color:#b0b3b8; text-align:right; margin-top:6px; }
</style>
</head>
<body>

<div class="page-head">
  <h1>Alert Hub</h1>
  <p>Campaign-health command center. P0 = urgent (broken/blocked). P1 = attention (overspend, stopped spending).</p>
</div>

<div class="wrap">
  <!-- Top bar: metrics + filters -->
  <div class="top-bar">
    <div class="metrics-strip" id="metrics"></div>
    <div class="filters-strip">
      <div class="fg"><label>Severity</label>
        <select id="f-sev"><option value="all">All</option><option value="P0">P0 only</option><option value="P1">P1 only</option></select>
      </div>
      <div class="fg"><label>Type</label><select id="f-type"><option value="all">All types</option></select></div>
      <div class="fg"><label>AM</label><select id="f-am"><option value="all">All AMs</option></select></div>
      <div class="fg"><label>AV</label>
        <select id="f-av"><option value="all">All</option><option value="has">Has AV</option><option value="no">No AV</option><option value="other">In Progress / Stuck</option></select>
      </div>
      <div class="fg"><label>Search</label><input id="f-q" type="text" placeholder="client, campaign, detail…"></div>
      <button class="fbtn clear" id="clear-btn">Clear all</button>
    </div>
  </div>

  <!-- Dashboard: sidebar + main table -->
  <div class="dash">
    <!-- Sidebar -->
    <div class="side-panel">
      <h3>By alert type</h3>
      <div id="type-breakdown"></div>
      <h3 style="margin-top:20px;">By account manager</h3>
      <div id="am-breakdown"></div>
    </div>

    <!-- Main -->
    <div class="main-panel">
      <div class="table-header">
        <h3>Active alerts</h3>
        <div class="table-meta" id="table-meta"></div>
      </div>
      <div id="table-view"></div>
      <div class="pager" id="pager" style="display:none;"></div>
    </div>
  </div>

  <div class="refreshed" id="refreshed"></div>
</div>

<script>
const DATA_URL = "/api/alerts";

const TYPE_LABEL = {
  campaign_suspended: "Campaign suspended",
  ads_disapproved:    "Ads disapproved",
  overspend:          "Overspend",
  no_spend:           "Stopped spending"
};
const TYPE_COLOR = {
  campaign_suspended: "red",
  ads_disapproved:    "orange",
  overspend:          "blue",
  no_spend:           "purple"
};
const SEV_ORDER = { P0:0, P1:1 };

let ROWS = [];
let FILTERS = { sev:"all", type:"all", am:"all", av:"all", q:"" };
let PAGE = 1;
const PER_PAGE = 25;

function isNew(dt){ return dt ? ((new Date()-new Date(dt))/(1000*60*60))<24 : false; }
function fmtDate(dt){ return dt ? new Date(dt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '-'; }
function fmtTime(dt){ return dt ? new Date(dt).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : ''; }
function fmtRelative(dt){
  if(!dt) return '';
  const h = Math.round((new Date()-new Date(dt))/(1000*60*60));
  if(h<1) return 'just now';
  if(h<24) return h+'h ago';
  const d = Math.floor(h/24);
  return d+'d ago';
}
function gadsUrl(cid){
  if(cid) return 'https://ads.google.com/aw/overview?ocid='+encodeURIComponent(cid);
  return 'https://ads.google.com';
}

async function loadData(){
  document.getElementById('table-view').innerHTML = '<div class="state"><div class="spinner"></div>Loading alerts&hellip;</div>';
  try{
    const res = await fetch(DATA_URL, {method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const rows = Array.isArray(data) ? data : (data.rows || data.data || []);
    ROWS = (rows||[]).map(r=>({
      alert_type: String(r.alert_type||''),
      severity: String(r.severity||''),
      source: String(r.source||''),
      customer_id: r.customer_id!=null?String(r.customer_id):'',
      client_name: r.client_name?String(r.client_name):null,
      account_manager: r.account_manager?String(r.account_manager):'(Unassigned)',
      tier: r.tier?String(r.tier):null,
      sub_mcc: r.sub_mcc?String(r.sub_mcc):null,
      av_status: r.av_status?String(r.av_status):null,
      entity_id: r.entity_id!=null?String(r.entity_id):'',
      entity_name: r.entity_name?String(r.entity_name):null,
      detail: r.detail?String(r.detail):'',
      detected_at: r.detected_at?String(r.detected_at):null
    }));
    buildFilters();
    PAGE = 1;
    render();
    const stamp = ROWS.length && ROWS[0].detected_at ? new Date(ROWS[0].detected_at).toLocaleString() : new Date().toLocaleString();
    document.getElementById('refreshed').textContent = 'Data as of '+stamp;
  }catch(err){
    document.getElementById('table-view').innerHTML = '<div class="state"><div class="big">Could not load alerts</div>'+err.message+'<br><button class="retry" onclick="loadData()">Retry</button></div>';
  }
}

function buildFilters(){
  const types = [...new Set(ROWS.map(r=>r.alert_type))].sort();
  const ams   = [...new Set(ROWS.map(r=>r.account_manager))].sort();
  const tSel = document.getElementById('f-type');
  const aSel = document.getElementById('f-am');
  tSel.innerHTML = '<option value="all">All types</option>' + types.map(t=>'<option value="'+t+'">'+(TYPE_LABEL[t]||t)+'</option>').join('');
  aSel.innerHTML = '<option value="all">All AMs</option>' + ams.map(a=>'<option value="'+a+'">'+a+'</option>').join('');

  const onChange = ()=>{ PAGE=1; render(); };
  document.getElementById('f-sev').onchange = e=>{ FILTERS.sev=e.target.value; onChange(); };
  tSel.onchange = e=>{ FILTERS.type=e.target.value; onChange(); };
  aSel.onchange = e=>{ FILTERS.am=e.target.value; onChange(); };
  document.getElementById('f-av').onchange = e=>{ FILTERS.av=e.target.value; onChange(); };
  document.getElementById('f-q').oninput = e=>{ FILTERS.q=e.target.value.toLowerCase(); onChange(); };

  document.getElementById('clear-btn').onclick = ()=>{
    FILTERS={sev:"all",type:"all",am:"all",av:"all",q:""};
    document.getElementById('f-sev').value="all";
    document.getElementById('f-type').value="all";
    document.getElementById('f-am').value="all";
    document.getElementById('f-av').value="all";
    document.getElementById('f-q').value="";
    onChange();
  };
}

function applyFilters(rows){
  return rows.filter(r=>{
    if(FILTERS.sev!=='all' && r.severity!==FILTERS.sev) return false;
    if(FILTERS.type!=='all' && r.alert_type!==FILTERS.type) return false;
    if(FILTERS.am!=='all' && r.account_manager!==FILTERS.am) return false;
    if(FILTERS.av!=='all'){
      const isApproved = (r.av_status||'').toLowerCase()==='av approved';
      const isNo = (r.av_status||'').toLowerCase()==='no' || (r.av_status||'').toLowerCase()==='no av';
      if(FILTERS.av==='has' && !isApproved) return false;
      if(FILTERS.av==='no' && !isNo) return false;
      if(FILTERS.av==='other' && (isApproved||isNo)) return false;
    }
    if(FILTERS.q){
      const hay = (r.client_name||'')+' '+(r.entity_name||'')+' '+(r.detail||'')+' '+r.customer_id+' '+(r.account_manager||'');
      if(hay.toLowerCase().indexOf(FILTERS.q)<0) return false;
    }
    return true;
  });
}

function avClass(s){
  const k = (s||'').toLowerCase();
  if(k==='av approved') return 'ok';
  if(k==='no' || k==='no av') return 'no';
  if(k==='in progress') return 'prog';
  if(k==='stuck') return 'stuck';
  return 'na';
}
function avText(s){
  const k = (s||'').toLowerCase();
  if(k==='av approved') return 'AV Approved';
  if(k==='no' || k==='no av') return 'No AV';
  if(k==='in progress') return 'In Progress';
  if(k==='stuck') return 'Stuck';
  return s || 'no data';
}

/* ===== RENDER SIDEBAR ===== */
function renderSidebar(rows){
  // Type breakdown
  const typeCounts = {};
  rows.forEach(r=>{ typeCounts[r.alert_type]=(typeCounts[r.alert_type]||0)+1; });
  const typeKeys = Object.keys(typeCounts).sort((a,b)=>typeCounts[b]-typeCounts[a]);
  const maxType = Math.max(...Object.values(typeCounts), 1);

  document.getElementById('type-breakdown').innerHTML = typeKeys.map(t=>{
    const c = TYPE_COLOR[t] || 'gray';
    const pct = Math.round((typeCounts[t]/maxType)*100);
    return `<div class="type-row" onclick="filterByType('${t}')">
      <div class="t-icon ${c}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c==='red'?'#c5221f':c==='orange'?'#b06000':c==='blue'?'#4285F4':'#a142f4'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${t==='ads_disapproved'?'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>':
            t==='campaign_suspended'?'<rect x="6" y="4" width="12" height="16" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/>':
            t==='overspend'?'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>':
            '<circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>'}
        </svg>
      </div>
      <div class="t-body">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="t-name">${TYPE_LABEL[t]||t}</span>
          <span class="t-count">${typeCounts[t]}</span>
        </div>
        <div class="t-bar"><div class="t-bar-fill ${c}" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');

  // AM breakdown
  const amCounts = {};
  rows.forEach(r=>{ amCounts[r.account_manager]=(amCounts[r.account_manager]||0)+1; });
  const amKeys = Object.keys(amCounts).sort((a,b)=>amCounts[b]-amCounts[a]).slice(0, 15);

  document.getElementById('am-breakdown').innerHTML = amKeys.map(a=>{
    const amRows = rows.filter(r=>r.account_manager===a);
    const hasP0 = amRows.some(r=>r.severity==='P0');
    return `<div class="am-row" onclick="filterByAm('${a}')">
      <span class="am-name">${a}</span>
      <span class="am-count ${hasP0?'p0':'p1'}">${amCounts[a]}</span>
    </div>`;
  }).join('');
}

function filterByType(t){
  FILTERS.type = t;
  document.getElementById('f-type').value = t;
  PAGE=1; render();
}
function filterByAm(a){
  FILTERS.am = a;
  document.getElementById('f-am').value = a;
  PAGE=1; render();
}

/* ===== RENDER METRICS ===== */
function renderMetrics(rows){
  const total = rows.length;
  const p0 = rows.filter(r=>r.severity==='P0').length;
  const p1 = rows.filter(r=>r.severity==='P1').length;
  const hasAv = rows.filter(r=>(r.av_status||'').toLowerCase()==='av approved').length;
  document.getElementById('metrics').innerHTML = `
    <div class="m-chip"><div class="m-dot gray"></div><div class="m-body"><div class="m-val">${total}</div><div class="m-lbl">Total</div></div></div>
    <div class="m-chip p0"><div class="m-dot p0"></div><div class="m-body"><div class="m-val">${p0}</div><div class="m-lbl">P0 Urgent</div></div></div>
    <div class="m-chip p1"><div class="m-dot p1"></div><div class="m-body"><div class="m-val">${p1}</div><div class="m-lbl">P1 Attention</div></div></div>
    <div class="m-chip ok"><div class="m-dot ok"></div><div class="m-body"><div class="m-val">${hasAv}</div><div class="m-lbl">On AV</div></div></div>`;
}

/* ===== RENDER TABLE ===== */
function renderTable(rows){
  if(rows.length===0){
    document.getElementById('table-view').innerHTML = '<div class="empty"><div class="big">No alerts match</div>Try adjusting filters or search.</div>';
    document.getElementById('pager').style.display = 'none';
    document.getElementById('table-meta').textContent = '';
    return;
  }

  rows.sort((a,b)=>{
    const sa = SEV_ORDER[a.severity] ?? 9;
    const sb = SEV_ORDER[b.severity] ?? 9;
    if(sa !== sb) return sa - sb;
    return new Date(b.detected_at||0) - new Date(a.detected_at||0);
  });

  const totalPages = Math.ceil(rows.length / PER_PAGE);
  const start = (PAGE-1) * PER_PAGE;
  const pageRows = rows.slice(start, start + PER_PAGE);

  const body = pageRows.map(r=>{
    const n = isNew(r.detected_at);
    const url = gadsUrl(r.customer_id);
    const avc = avClass(r.av_status);
    const avt = avText(r.av_status);
    return `<tr class="${r.severity.toLowerCase()}">
      <td class="cell-sev"><span class="sev-tag ${r.severity.toLowerCase()}">${r.severity}</span></td>
      <td class="cell-type"><span class="type-tag">${TYPE_LABEL[r.alert_type]||r.alert_type}</span></td>
      <td class="cell-client">
        <div class="c-name">${r.client_name || '('+r.customer_id+')'}${n?'<span class="new-tag">New</span>':''}</div>
        <div class="c-meta">${r.account_manager}${r.tier?' · '+r.tier:''}${r.sub_mcc?' · '+r.sub_mcc:''}</div>
        ${r.entity_name?'<div class="c-entity">'+r.entity_name+'</div>':''}
      </td>
      <td class="cell-av"><span class="av-tag ${avc}">${avt}</span></td>
      <td class="cell-detail">
        <div class="d-text">${r.detail}</div>
        <div class="d-time">${fmtRelative(r.detected_at)} · ${fmtDate(r.detected_at)} ${fmtTime(r.detected_at)}</div>
      </td>
      <td class="cell-actions"><a href="${url}" target="_blank" rel="noopener">Open account</a></td>
    </tr>`;
  }).join('');

  document.getElementById('table-view').innerHTML = `
    <table class="alert-table">
      <thead><tr><th>Sev</th><th>Type</th><th>Client</th><th>AV</th><th>Detail</th><th>Action</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;

  document.getElementById('table-meta').textContent = `Showing ${start+1}-${Math.min(start+PER_PAGE, rows.length)} of ${rows.length}`;

  const pg = document.getElementById('pager');
  if(totalPages > 1){
    pg.style.display = 'flex';
    pg.innerHTML = `
      <div class="pg-info">Page ${PAGE} of ${totalPages}</div>
      <div class="pg-btns">
        <button ${PAGE<=1?'disabled':''} onclick="PAGE--;render();">Prev</button>
        <button ${PAGE>=totalPages?'disabled':''} onclick="PAGE++;render();">Next</button>
      </div>`;
  } else {
    pg.style.display = 'none';
  }
}

/* ===== MAIN RENDER ===== */
function render(){
  const rows = applyFilters(ROWS);
  const isFiltered = FILTERS.sev!=='all'||FILTERS.type!=='all'||FILTERS.am!=='all'||FILTERS.av!=='all'||FILTERS.q!=='';
  document.getElementById('clear-btn').classList.toggle('show', isFiltered);

  renderMetrics(rows);
  renderSidebar(ROWS); // sidebar always shows global breakdown
  renderTable(rows);
}

loadData();
</script>

<script src="/cortex-shell.js" defer></script>
