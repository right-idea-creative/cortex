<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts — CORTEX OS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
}

/* Nav injected by /cortex-shell.js */

.page-head { background:#fff; border-bottom:1px solid #e8eaed; padding: 26px 32px 22px; }
.page-head h1 { font-size: 26px; font-weight: 800; letter-spacing:-.5px; color:#0d1b2a; }
.page-head p { font-size: 13px; color:#757575; margin-top: 4px; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 32px 70px; }

select, input {
  font: inherit; font-size:13px; padding: 7px 11px; border: 1px solid #d4d7dc;
  border-radius: 8px; background: #fff; color:#1a1a2e; cursor:pointer;
}
select:focus, input:focus { outline:none; border-color:#4285F4; }

/* Cards */
.cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin: 0 0 22px; }
@media(max-width:900px){ .cards { grid-template-columns:repeat(2,1fr); } }
@media(max-width:480px){ .cards { grid-template-columns:1fr; } }

.card { background:#fff; border:1px solid #e8eaed; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.card .lbl { font-size:12px; color:#9e9e9e; font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
.card .val { font-size:28px; font-weight:800; color:#0d1b2a; letter-spacing:-.5px; }
.card .csub { font-size:12px; color:#9e9e9e; margin-top:2px; }
.card.p0 .val { color:#ea4335; }
.card.p1 .val { color:#f6b26b; }
.card.ok .val { color:#137333; }

/* Filters */
.filters { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin: 0 0 16px; }
.filters .fg { display:flex; flex-direction:column; gap:5px; }
.filters .fg span { font-size:11px; font-weight:700; color:#9e9e9e; text-transform:uppercase; letter-spacing:.5px; }
.filters .fg select, .filters .fg input { height:38px; padding:0 12px; font-size:13px; color:#0d1b2a;
  background:#fff; border:1px solid #d4d7dc; border-radius:8px; min-width:150px; box-shadow:0 1px 2px rgba(0,0,0,.04);
  appearance:auto; outline:none; }
.filters .fg input { min-width:180px; }

.clear-btn { font-size:13px; padding:8px 14px; border:1px solid #d4d7dc; border-radius:8px; background:#fff;
  color:#5f6368; cursor:pointer; font:inherit; transition:all .15s ease; }
.clear-btn:hover { color:#0d1b2a; border-color:#0d1b2a; }

/* Toggle group */
.toggle-row { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.toggle-btn { font-size:13px; padding:6px 14px; border:1px solid #d4d7dc; border-radius:8px; background:#fff;
  color:#5f6368; cursor:pointer; font:inherit; transition:all .15s ease; }
.toggle-btn:hover { border-color:#0d1b2a; color:#0d1b2a; }
.toggle-btn.active { background:#0d1b2a; color:#fff; border-color:#0d1b2a; }

/* Panels / tables */
.panel { background:#fff; border:1px solid #e8eaed; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); overflow:hidden; margin-bottom:18px; }
.panel.p0 { border-left:4px solid #ea4335; }
.panel.p1 { border-left:4px solid #f6b26b; }
.panel-h { font-size:14px; font-weight:700; padding:14px 18px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid #eef0f2; }
.panel-h .cnt { background:#eef0f2; color:#5f6368; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:700; }

table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:12px 16px; border-bottom:1px solid #eef0f2; vertical-align:top; }
th { color:#9e9e9e; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
tbody tr:last-child td { border-bottom:none; }
tr:hover { background:#f7f9fc; }
td .cn { font-weight:700; color:#0d1b2a; }
td .sub { font-size:11px; color:#9e9e9e; margin-top:2px; }
td .entity { font-size:11px; color:#5f6368; margin-top:2px; }
td .detail-text { color:#3c4043; max-width:380px; line-height:1.45; }
td .meta { font-size:11px; color:#b0b3b8; margin-top:4px; }

/* Severity pills */
.pill { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700; display:inline-block; white-space:nowrap; }
.p-p0   { background:#ea4335; color:#fff; }
.p-p1   { background:#f6b26b; color:#783f04; }

/* AV pills */
.av { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700; display:inline-block; white-space:nowrap; }
.av-ok    { background:#d9ead3; color:#274e13; }
.av-no    { background:#f4cccc; color:#990000; }
.av-prog  { background:#ffe599; color:#7f6000; }
.av-stuck { background:#fce5cd; color:#b45309; }
.av-na    { background:#eef0f2; color:#9e9e9e; }

/* Type chips */
.tc { font-size:10px; padding:2px 8px; border-radius:6px; font-weight:700; display:inline-block; background:#e8eaed; color:#5f6368; white-space:nowrap; }

/* New badge */
.badge-new { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:700; background:#fce8e6; color:#c5221f; margin-left:6px; vertical-align:middle; }

/* Actions */
.actions { display:flex; gap:6px; opacity:0; transition:opacity .15s ease; }
tr:hover .actions, tr:focus-within .actions { opacity:1; }
.action-btn { font-size:12px; padding:5px 10px; border:1px solid #d4d7dc; border-radius:6px; background:#fff;
  color:#5f6368; cursor:pointer; font:inherit; text-decoration:none; display:inline-block; transition:all .15s ease; }
.action-btn:hover { color:#0d1b2a; border-color:#0d1b2a; }

/* States */
.state { text-align:center; padding:70px 20px; color:#9e9e9e; }
.state .big { font-size:16px; font-weight:700; color:#5f6368; margin-bottom:8px; }
.spinner { width:26px; height:26px; border:3px solid #e0e0e0; border-top-color:#00D4AA; border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.retry { margin-top:14px; padding:8px 16px; border:1px solid #d4d7dc; border-radius:8px; background:#fff; cursor:pointer; font:inherit; font-size:13px; }
.empty { text-align:center; padding:40px 20px; color:#9e9e9e; font-size:13px; }
.refreshed { font-size:11px; color:#b0b3b8; text-align:right; margin-top:4px; }
</style>
</head>
<body>

<div class="page-head">
  <h1>Alerts</h1>
  <p>Campaign-health alerts across the portfolio. P0 = urgent (broken/blocked). P1 = attention (overspend, stopped spending).</p>
</div>

<div class="wrap">
  <div class="cards" id="cards"></div>

  <div class="filters">
    <div class="fg"><span>Severity</span>
      <select id="f-sev"><option value="all">All</option><option value="P0">P0 only</option><option value="P1">P1 only</option></select>
    </div>
    <div class="fg"><span>Type</span><select id="f-type"><option value="all">All types</option></select></div>
    <div class="fg"><span>Account Manager</span><select id="f-am"><option value="all">All AMs</option></select></div>
    <div class="fg"><span>AV Status</span>
      <select id="f-av">
        <option value="all">All</option>
        <option value="has">Has AV (Approved)</option>
        <option value="no">No AV</option>
        <option value="other">In Progress / Stuck</option>
      </select>
    </div>
    <div class="fg"><span>Search</span><input id="f-q" type="text" placeholder="client, campaign, or detail…"></div>
    <button class="clear-btn" id="clear-btn" style="display:none;">Clear all</button>
  </div>

  <div class="toggle-row">
    <button class="toggle-btn active" id="grp-sev" onclick="setGroup('severity')">Group by severity</button>
    <button class="toggle-btn" id="grp-am" onclick="setGroup('am')">Group by AM</button>
    <button class="toggle-btn" id="grp-type" onclick="setGroup('type')">Group by type</button>
  </div>

  <div id="view"></div>
  <div class="refreshed" id="refreshed"></div>
</div>

<script>
/* =====================================================================
   DATA WIRING
   DATA_URL : GET /api/alerts -> Cloudflare Pages Function (functions/api/alerts.js)
   which queries BigQuery transformed.alerts_active and returns { rows, as_of }.
   ===================================================================== */
const DATA_URL = "/api/alerts";

const TYPE_LABEL = {
  campaign_suspended: "Campaign suspended",
  ads_disapproved:    "Ads disapproved",
  overspend:          "Overspend",
  no_spend:           "Stopped spending"
};
const SEV_ORDER = { P0:0, P1:1, P2:2 };

let ROWS = [];
let FILTERS = { sev:"all", type:"all", am:"all", av:"all", q:"" };
let GROUP_BY = "severity";

const view = document.getElementById('view');

function avPill(s){
  if(!s) return '<span class="av av-na">no AV data</span>';
  const k = s.toLowerCase();
  if(k==='av approved') return '<span class="av av-ok">AV Approved</span>';
  if(k==='no' || k==='no av') return '<span class="av av-no">No AV</span>';
  if(k==='in progress') return '<span class="av av-prog">In Progress</span>';
  if(k==='stuck')       return '<span class="av av-stuck">Stuck</span>';
  return '<span class="av av-na">'+s+'</span>';
}
function sevPill(s){ return '<span class="pill p-'+(s||'').toLowerCase()+'">'+(s||'?')+'</span>'; }
function sourceLabel(s){ return s==='google_ads'?'Google Ads':(s==='meta'?'Meta':(s||'Other')); }
function isNew(dt){ return dt ? ((new Date()-new Date(dt))/(1000*60*60))<24 : false; }
function fmtDate(dt){ return dt ? new Date(dt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '-'; }
function fmtTime(dt){ return dt ? new Date(dt).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : ''; }

function showState(html){ view.innerHTML='<div class="state">'+html+'</div>'; }

async function loadData(){
  showState('<div class="spinner"></div>Loading alerts&hellip;');
  try{
    const res = await fetch(DATA_URL, {method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const rows = Array.isArray(data) ? data : (data.rows || data.data || []);
    ROWS = (rows||[]).map(r=>({
      alert_type: String(r.alert_type||''),
      severity: String(r.severity||''),
      source: String(r.source||''),
      customer_id: r.customer_id!=null?String(r.customer_id):'',
      client_name: r.client_name?String(r.client_name):null,
      account_manager: r.account_manager?String(r.account_manager):'(Unassigned)',
      tier: r.tier?String(r.tier):null,
      sub_mcc: r.sub_mcc?String(r.sub_mcc):null,
      av_status: r.av_status?String(r.av_status):null,
      entity_id: r.entity_id!=null?String(r.entity_id):'',
      entity_name: r.entity_name?String(r.entity_name):null,
      detail: r.detail?String(r.detail):'',
      detected_at: r.detected_at?String(r.detected_at):null
    }));
    buildFilters();
    render();
    const stamp = ROWS.length && ROWS[0].detected_at ? new Date(ROWS[0].detected_at).toLocaleString() : new Date().toLocaleString();
    document.getElementById('refreshed').textContent = 'Data as of '+stamp;
  }catch(err){
    showState('<div class="big">Could not load alerts</div>'+err.message+
      '<br><button class="retry" onclick="loadData()">Retry</button>');
  }
}

function buildFilters(){
  const types = [...new Set(ROWS.map(r=>r.alert_type))].sort();
  const ams   = [...new Set(ROWS.map(r=>r.account_manager))].sort();
  const tSel = document.getElementById('f-type');
  const aSel = document.getElementById('f-am');
  tSel.innerHTML = '<option value="all">All types</option>' +
    types.map(t=>'<option value="'+t+'">'+(TYPE_LABEL[t]||t)+'</option>').join('');
  aSel.innerHTML = '<option value="all">All AMs</option>' +
    ams.map(a=>'<option value="'+a+'">'+a+'</option>').join('');
  document.getElementById('f-sev').onchange  = e=>{ FILTERS.sev=e.target.value; render(); };
  tSel.onchange = e=>{ FILTERS.type=e.target.value; render(); };
  aSel.onchange = e=>{ FILTERS.am=e.target.value; render(); };
  document.getElementById('f-av').onchange = e=>{ FILTERS.av=e.target.value; render(); };
  document.getElementById('f-q').oninput = e=>{ FILTERS.q=e.target.value.toLowerCase(); render(); };
  document.getElementById('clear-btn').onclick = ()=>{
    FILTERS={sev:"all",type:"all",am:"all",av:"all",q:""};
    document.getElementById('f-sev').value="all";
    document.getElementById('f-type').value="all";
    document.getElementById('f-am').value="all";
    document.getElementById('f-av').value="all";
    document.getElementById('f-q').value="";
    render();
  };
}

function applyFilters(rows){
  return rows.filter(r=>{
    if(FILTERS.sev!=='all' && r.severity!==FILTERS.sev) return false;
    if(FILTERS.type!=='all' && r.alert_type!==FILTERS.type) return false;
    if(FILTERS.am!=='all' && r.account_manager!==FILTERS.am) return false;
    if(FILTERS.av!=='all'){
      const isApproved = (r.av_status||'').toLowerCase()==='av approved';
      const isNo = (r.av_status||'').toLowerCase()==='no' || (r.av_status||'').toLowerCase()==='no av';
      if(FILTERS.av==='has'   && !isApproved) return false;
      if(FILTERS.av==='no'    && !isNo)       return false;
      if(FILTERS.av==='other' && (isApproved||isNo)) return false;
    }
    if(FILTERS.q){
      const hay = (r.client_name||'')+' '+(r.entity_name||'')+' '+(r.detail||'')+' '+r.customer_id;
      if(hay.toLowerCase().indexOf(FILTERS.q)<0) return false;
    }
    return true;
  });
}

function setGroup(mode){
  GROUP_BY = mode;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('grp-'+mode).classList.add('active');
  render();
}

function render(){
  const rows = applyFilters(ROWS);
  const isFiltered = FILTERS.sev!=='all'||FILTERS.type!=='all'||FILTERS.am!=='all'||FILTERS.av!=='all'||FILTERS.q!=='';
  document.getElementById('clear-btn').style.display = isFiltered ? 'inline-block' : 'none';

  // Cards: filtered totals when filtered, else global
  const base = isFiltered ? rows : ROWS;
  const total = base.length;
  const p0 = base.filter(r=>r.severity==='P0').length;
  const p1 = base.filter(r=>r.severity==='P1').length;
  const hasAv = base.filter(r=>(r.av_status||'').toLowerCase()==='av approved').length;
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="lbl">Total alerts</div><div class="val">${total}</div></div>
    <div class="card p0"><div class="lbl">P0 · Urgent</div><div class="val">${p0}</div><div class="csub">broken / blocked</div></div>
    <div class="card p1"><div class="lbl">P1 · Attention</div><div class="val">${p1}</div><div class="csub">overspend / stopped</div></div>
    <div class="card ok"><div class="lbl">On AV accounts</div><div class="val">${hasAv}</div><div class="csub">verified — priority</div></div>`;

  if(rows.length===0){
    view.innerHTML='<div class="panel"><div class="empty"><div class="big">No alerts match</div>Try adjusting filters or search.</div></div>';
    return;
  }

  // Group
  const groups = {};
  rows.forEach(r=>{
    let key;
    if(GROUP_BY==='severity') key = r.severity;
    else if(GROUP_BY==='am') key = r.account_manager;
    else key = r.alert_type;
    (groups[key]=groups[key]||[]).push(r);
  });

  let keys;
  if(GROUP_BY==='severity') keys = Object.keys(groups).sort((a,b)=>(SEV_ORDER[a]??9)-(SEV_ORDER[b]??9));
  else if(GROUP_BY==='am') keys = Object.keys(groups).sort();
  else keys = Object.keys(groups).sort((a,b)=> (TYPE_LABEL[a]||a).localeCompare(TYPE_LABEL[b]||b));

  view.innerHTML = keys.map(key=>{
    const g = groups[key];
    const sev = GROUP_BY==='severity' ? key : (g[0].severity||'P1');
    const title = GROUP_BY==='severity' ? (key==='P0'?'P0 · Urgent':(key==='P1'?'P1 · Attention':key))
      : (GROUP_BY==='am' ? key : (TYPE_LABEL[key]||key));
    const body = g.map(r=>{
      const n = isNew(r.detected_at);
      const gadsLink = 'https://ads.google.com/aw/overview?ocid='+encodeURIComponent(r.customer_id);
      return `<tr>
        <td>${sevPill(r.severity)}</td>
        <td><span class="tc">${TYPE_LABEL[r.alert_type]||r.alert_type}</span></td>
        <td>
          <div class="cn">${r.client_name || '('+r.customer_id+')'}${n?'<span class="badge-new">New</span>':''}</div>
          <div class="sub">${r.account_manager}${r.tier?' · '+r.tier:''}${r.sub_mcc?' · '+r.sub_mcc:''}</div>
          <div class="entity">${r.entity_name||''}</div>
        </td>
        <td>${avPill(r.av_status)}</td>
        <td>
          <div class="detail-text">${r.detail}</div>
          <div class="meta">${sourceLabel(r.source)} · ${fmtDate(r.detected_at)} ${fmtTime(r.detected_at)}</div>
        </td>
        <td style="width:1px;white-space:nowrap;">
          <div class="actions">
            <a class="action-btn" href="${gadsLink}" target="_blank" rel="noopener">Open in Ads</a>
          </div>
        </td>
      </tr>`;
    }).join('');
    return `<div class="panel ${sev.toLowerCase()}">
      <div class="panel-h">${title}<span class="cnt">${g.length}</span></div>
      <table>
        <thead><tr><th>Sev</th><th>Type</th><th>Client</th><th>AV</th><th>Detail</th><th style="width:1px;">Actions</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
  }).join('');
}

loadData();
</script>

<script src="/cortex-shell.js" defer></script>
</body>
</html>
